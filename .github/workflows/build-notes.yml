name: Build English lecture notes PDF
on:
  push:
    branches: [main]
    paths:
      - 'main.tex'
      - 'chapters/**'
      - 'figures/**'
      - 'frontmatter/**'
      - 'references/**'
      - 'scripts/check_new_chapters.py'
      - 'scripts/check_display_equations.py'
      - 'scripts/check_notation_consistency.py'
      - 'scripts/check_notation_collisions.py'
      - 'scripts/check_content_additions.py'
      - 'scripts/check_visual_assets.py'
      - 'scripts/check_teaching_derivations.py'
      - 'scripts/check_interactive_guides.py'
      - 'latexmkrc'
      - '.github/workflows/build-notes.yml'
  workflow_dispatch:

# Keep the most recent build when multiple source commits arrive together.
concurrency:
  group: lecture-notes-pdf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out versioned LaTeX sources
        uses: actions/checkout@v4

      - name: Check figure assets and AB geometry
        run: python3 scripts/check_visual_assets.py

      - name: Check all thirty-five in-text interactive study links
        run: python3 scripts/check_interactive_guides.py

      - name: Check all displayed equations are numbered
        run: python3 scripts/check_display_equations.py

      - name: Check all chapter files for notation collisions
        run: python3 scripts/check_notation_collisions.py

      - name: Check whole-book notation consistency
        run: python3 scripts/check_notation_consistency.py

      - name: Check step-by-step teaching bridges and non-Hermitian model
        run: python3 scripts/check_teaching_derivations.py

      - name: Check supplementary quantum algebra
        shell: bash
        run: |
          python3 -m venv /tmp/aqm-checks
          /tmp/aqm-checks/bin/python -m pip install --quiet sympy
          /tmp/aqm-checks/bin/python scripts/check_content_additions.py

      - name: Check topology and QML models
        run: python3 scripts/check_new_chapters.py

      - name: Compile notes with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          latexmk_use_xelatex: true
          args: -pdfxe -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Archive version-specific PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: advanced-quantum-mechanics-${{ github.sha }}
          path: main.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Update repository PDF
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the compiled PDF while refreshing the working tree from
          # the latest main. This avoids binary rebase conflicts if another
          # successful run updated the PDF during compilation.
          cp main.pdf "${RUNNER_TEMP}/advanced-quantum-mechanics.pdf"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main:refs/remotes/origin/main
          if ! git diff --quiet "${GITHUB_SHA}" origin/main -- main.tex chapters/ frontmatter/ figures/ references/ latexmkrc; then
            echo 'Source files changed during compilation; a newer source build must publish the PDF.'
            exit 1
          fi
          git reset --hard origin/main
          mkdir -p pdf
          cp "${RUNNER_TEMP}/advanced-quantum-mechanics.pdf" pdf/advanced-quantum-mechanics.pdf
          git add pdf/advanced-quantum-mechanics.pdf
          if git diff --cached --quiet; then
            echo 'PDF is already current; no new commit needed.'
            exit 0
          fi
          git commit -m 'build: update versioned lecture notes PDF [skip ci]'
          git push origin HEAD:main
