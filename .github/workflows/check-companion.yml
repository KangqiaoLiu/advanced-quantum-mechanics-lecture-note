name: Check interactive companion catalog
on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - 'INTERACTIVE_COMPANION_BLUEPRINT.md'
      - 'main.tex'
      - 'scripts/check_companion_catalog.py'
      - '.github/workflows/check-companion.yml'
  pull_request:
    paths:
      - 'companion/**'
      - 'INTERACTIVE_COMPANION_BLUEPRINT.md'
      - 'main.tex'
      - 'scripts/check_companion_catalog.py'
      - '.github/workflows/check-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out course source files
        uses: actions/checkout@v4
      - name: Check nine-chapter catalog and note mappings
        run: python3 scripts/check_companion_catalog.py
      - name: Check companion browser JavaScript syntax
        run: node --check companion/assets/site.js
