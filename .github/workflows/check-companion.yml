name: Check interactive companion catalog and physics
on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - '.devcontainer/**'
      - 'INTERACTIVE_COMPANION_BLUEPRINT.md'
      - 'main.tex'
      - 'COPYRIGHT.md'
      - 'LICENSE'
      - 'LICENSE-CONTENT.md'
      - 'NOTICE'
      - 'CITATION.cff'
      - 'CONTRIBUTING.md'
      - 'CONTRIBUTORS.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'scripts/check_companion_catalog.py'
      - 'scripts/check_license_policy.py'
      - 'scripts/check_student_surfaces.py'
      - 'scripts/test_companion_models.cjs'
      - 'scripts/check_companion_browser.py'
      - 'scripts/check_companion_pages.py'
      - '.github/workflows/check-companion.yml'
  pull_request:
    paths:
      - 'companion/**'
      - '.devcontainer/**'
      - 'INTERACTIVE_COMPANION_BLUEPRINT.md'
      - 'main.tex'
      - 'COPYRIGHT.md'
      - 'LICENSE'
      - 'LICENSE-CONTENT.md'
      - 'NOTICE'
      - 'CITATION.cff'
      - 'CONTRIBUTING.md'
      - 'CONTRIBUTORS.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'scripts/check_companion_catalog.py'
      - 'scripts/check_license_policy.py'
      - 'scripts/test_companion_models.cjs'
      - '.github/workflows/check-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out course source files
        uses: actions/checkout@v4
      - name: Verify copyright, licenses and contribution attribution
        run: python3 scripts/check_license_policy.py
      - name: Check nine-chapter catalog and note mappings
        run: python3 scripts/check_companion_catalog.py
      - name: Check that student pages have no internal milestones or developer links
        run: python3 scripts/check_student_surfaces.py
      - name: Check every browser JavaScript source
        run: |
          node --check companion/assets/site.js
          node --check companion/assets/lab-core.js
          for f in companion/labs/IC-*/model.js companion/labs/IC-*/lab.js; do node --check "$f"; done
      - name: Check all independently benchmarked quantum models
        run: node scripts/test_companion_models.cjs
      - name: Check static laboratory HTML and links
        run: python3 scripts/check_companion_pages.py
      - name: Smoke test all numerical laboratories and reading catalog in headless Chrome
        run: python3 scripts/check_companion_browser.py

      - name: Check private Codespaces preview configuration and HTTP startup
        shell: bash
        run: |
          bash -n .devcontainer/start-preview.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path(".devcontainer/devcontainer.json").read_text())
          assert c.get("forwardPorts") == [8000]
          assert c["portsAttributes"]["8000"]["onAutoForward"] == "openBrowser"
          assert "image" not in c, "Use the included GitHub Codespaces base image."
          assert c["postStartCommand"] == "bash .devcontainer/start-preview.sh"
          PY
          bash .devcontainer/start-preview.sh
          python3 - <<'PY'
          import json, urllib.request
          from urllib.parse import urljoin
          base = "http://127.0.0.1:8000/companion/"
          with urllib.request.urlopen(base) as r:
              assert r.status == 200
              assert b"Choose an investigation or reading topic" in r.read()
          with urllib.request.urlopen(urljoin(base, "catalog.json")) as r:
              catalog = json.load(r)
              assert sum(bool(x.get("page")) for x in catalog["labs"]) == 35
              assert {x["chapter"] for x in catalog["labs"] if x.get("page")} == set(range(1,10))
          with urllib.request.urlopen(urljoin(base, "labs/IC-08-02/index.html")) as r:
              assert b"SSH" in r.read()
          print("PASS authenticated Codespaces HTTP preview preparation.")
          PY

