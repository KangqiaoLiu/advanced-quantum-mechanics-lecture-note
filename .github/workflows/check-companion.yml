name: Check interactive companion catalog and physics
on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - 'INTERACTIVE_COMPANION_BLUEPRINT.md'
      - 'main.tex'
      - 'scripts/check_companion_catalog.py'
      - 'scripts/test_companion_models.cjs'
      - 'scripts/check_companion_browser.py'
      - 'scripts/check_companion_pages.py'
      - '.github/workflows/check-companion.yml'
  pull_request:
    paths:
      - 'companion/**'
      - 'INTERACTIVE_COMPANION_BLUEPRINT.md'
      - 'main.tex'
      - 'scripts/check_companion_catalog.py'
      - 'scripts/test_companion_models.cjs'
      - '.github/workflows/check-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out course source files
        uses: actions/checkout@v4
      - name: Check nine-chapter catalog and note mappings
        run: python3 scripts/check_companion_catalog.py
      - name: Check every browser JavaScript source
        run: |
          node --check companion/assets/site.js
          node --check companion/assets/lab-core.js
          for f in companion/labs/IC-*/model.js companion/labs/IC-*/lab.js; do node --check "$f"; done
      - name: Check four analytic and numerical quantum models
        run: node scripts/test_companion_models.cjs
      - name: Check static laboratory HTML and links
        run: python3 scripts/check_companion_pages.py
      - name: Smoke test all four numerical labs in headless browser
        run: python3 scripts/check_companion_browser.py
