name: One-time historical branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-historical-branches.yml'

permissions:
  contents: write

jobs:
  remove-redundant-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete public commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify every historical branch is already in main and remove branch refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          refs=(
            'textbook/instructor-supplements-2026-10-16 f06d09edee12574b2d07f5bc5a0cd00c1a950a48'
            'textbook/pre-equation-figure-audit-2026-10-16 224b0b506a1ba635346d662af2dad82966b9a864'
            'textbook/pre-instructor-supplements-2026-10-16 8eaf087c5fc92f7c0f62e262207c102214956b3f'
            'textbook/pre-topology-qml-relativity-2026-10-16 f06d09edee12574b2d07f5bc5a0cd00c1a950a48'
            'textbook/topology-qml-relativity-2026-10-16 743c8b951f570fec1b92cd910471cfb69bf45a7c'
            'translation/fidelity-audited-2026-10-16 50ae0871c71708c6da35467216a9c11438fe3111'
            'translation/initial-baseline-2026-10-16 614becdcbbd9afa3782575a6c2619a3eb479186c'
          )
          for pair in "${refs[@]}"; do
            read -r branch expected <<< "$pair"
            found=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
            if [[ -z "$found" ]]; then
              echo "Branch already absent: $branch"
              continue
            fi
            if [[ "$found" != "$expected" ]]; then
              echo "SAFETY STOP: $branch moved ($found)" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$expected" origin/main; then
              echo "SAFETY STOP: unique commits exist on $branch" >&2
              exit 1
            fi
            echo "Removing obsolete public branch ref: $branch"
            git push origin ":refs/heads/$branch"
          done
          echo "Remaining public heads:"
          git ls-remote --heads origin
          count=$(git ls-remote --heads origin | wc -l)
          if [[ "$count" -ne 1 ]]; then
            echo "Expected only main after cleanup, found $count" >&2
            exit 1
          fi
          git ls-remote --heads origin | grep -F 'refs/heads/main'
          echo "PASS: all redundant branch refs removed, main history unchanged."
